plugins {
    id "com.android.application"
    id "kotlin-android"
    // id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

//def flutterRoot = localProperties.getProperty('flutter.sdk')
//if (flutterRoot == null) {
//    throw  GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
//}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

//apply plugin: 'com.android.application'
//apply plugin: 'kotlin-android'
//apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    // Must match the Kotlin package (com.punnyam.staff) so ".App", ".MainActivity"
    // and BuildConfig resolve. applicationId below can stay different.
    namespace = "com.punnyam.staff"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

//    sourceSets {
//        main.java.srcDirs += 'src/main/kotlin'
//    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
//        multiDexEnabled true
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.punnyam_payswiff"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // Payswiff SDK. Change PS_ENV to "release" when going live.
        buildConfigField "String", "PS_ENV", "\"uat\""
        buildConfigField "String", "PS_APP_NAME", "\"Punnyam\""
        buildConfigField "String", "PS_BANNER_NAME", "\"<BANNER_NAME>\""
    }
    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            signingConfig = signingConfigs.release

            // Payswiff SDK uses reflection (Gson on PrintModel, its own template
            // parser) and references optional libs it doesn't ship - R8 breaks it.
            minifyEnabled false
            shrinkResources false
            
        }
    }
        // The Payswiff SDK's older dependencies (Jackson, log4j, commons,
    // Bouncycastle) ship the same licence/notice files in META-INF.
    // They aren't needed at runtime, so drop the duplicates.
    packaging {
        resources {
            excludes += [
                'META-INF/ASL2.0',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/DEPENDENCIES',
                'META-INF/*.kotlin_module',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
            ]
        }
    }
    
    
     
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    // ---- Payswiff / APOS SDK (ps-n86Uat-v2.1.13.aar) requirements ----
    // Location
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    // Material: the SDK shows its error messages with Snackbar
    implementation 'com.google.android.material:material:1.12.0'
    // Retrofit / OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.squareup.okhttp3:okhttp:4.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.1.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.3.0'
    // Kotlin
    implementation 'androidx.core:core-ktx:1.3.2'
    // Encrypted Shared Preference
    implementation 'androidx.security:security-crypto:1.0.0-rc04'
    // Jackson
    implementation 'org.codehaus.jackson:jackson-core-asl:1.9.13'
    implementation 'org.codehaus.jackson:jackson-mapper-asl:1.9.13'
    // Commons Lang / IO
    implementation 'commons-lang:commons-lang:2.3'
    implementation 'commons-io:commons-io:2.6'
    // ZXing
    implementation 'com.google.zxing:core:2.3.0'
    // Log4j
    implementation 'de.mindpipe.android:android-logging-log4j:1.0.3'
    implementation 'log4j:log4j:1.2.17'
    // Bouncycastle
    implementation 'org.bouncycastle:bcprov-ext-jdk15on:1.54'
}

flutter {
    source '../..'
}

